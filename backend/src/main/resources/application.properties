spring.application.name=AppMunicipalBackend
server.address=0.0.0.0
server.port=8080

# Base de datos central de demostración. Persiste en backend/data/.
spring.datasource.url=jdbc:h2:file:./data/appmunicipal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola local para demostrar la base de datos.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fotografías almacenadas por el servidor.
app.storage.location=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

server.error.include-message=never
