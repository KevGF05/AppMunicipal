spring.application.name=AppMunicipalBackend
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8080}}

# Base de datos central de demostración local. Persiste en backend/data/.
spring.datasource.url=jdbc:h2:file:./data/appmunicipal;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola local para demostrar la base de datos.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fotografías locales para desarrollo. En producción el perfil supabase usa Storage S3.
app.storage.mode=${APP_STORAGE_MODE:local}
app.storage.location=${APP_STORAGE_LOCATION:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

server.error.include-message=never
