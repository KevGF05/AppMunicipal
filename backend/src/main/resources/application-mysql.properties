# Perfil opcional para MySQL. Ejecute con: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=${MUNICIPAL_DB_URL:jdbc:mysql://localhost:3306/appmunicipal?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MUNICIPAL_DB_USER:municipal}
spring.datasource.password=${MUNICIPAL_DB_PASSWORD:Municipal123*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
