# Perfil para producción con Supabase PostgreSQL + Supabase Storage S3.
# Actívelo con: SPRING_PROFILES_ACTIVE=supabase

spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Mantener un pool pequeño para el proyecto gratuito.
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${SUPABASE_DB_POOL_MIN:0}
spring.datasource.hikari.connection-timeout=30000

# Evidencias privadas en Supabase Storage mediante su endpoint S3.
app.storage.mode=s3
app.storage.s3.endpoint=${SUPABASE_S3_ENDPOINT}
app.storage.s3.region=${SUPABASE_S3_REGION}
app.storage.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
app.storage.s3.secret-key=${SUPABASE_S3_SECRET_KEY}
app.storage.s3.bucket=${SUPABASE_STORAGE_BUCKET:evidencias}
app.storage.s3.signed-url-minutes=${SUPABASE_SIGNED_URL_MINUTES:15}
